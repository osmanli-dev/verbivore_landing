# Host nginx config for the Verbivore stack (docker publishes the services
# on loopback: web → 127.0.0.1:3000, directus → 127.0.0.1:8055).
#
# Install on the server:
#   sudo cp nginx/verbivore.conf /etc/nginx/sites-available/verbivore.conf
#   sudo ln -s /etc/nginx/sites-available/verbivore.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# (on distros without sites-enabled, drop it into /etc/nginx/conf.d/ instead)
#
# HTTPS: easiest is `sudo certbot --nginx -d verbivore.org -d www.verbivore.org
# -d admin.verbivore.org` — certbot rewrites these blocks with the cert paths
# and HTTP→HTTPS redirects automatically, and sets up auto-renewal.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# verbivore.org — Next.js frontend
server {
    listen 80;
    listen [::]:80;
    server_name verbivore.org www.verbivore.org verbivore-thecontest.com verbivore-thecontest.org;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }
}

# admin.verbivore.org — Directus CMS
server {
    listen 80;
    listen [::]:80;
    server_name admin.verbivore.org admin.verbivore-thecontest.com admin.verbivore-thecontest.org;

    # Directus file uploads go through the admin UI
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8055;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
